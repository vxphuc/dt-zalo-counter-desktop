name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      mac_signed:
        description: 'Sign + notarize macOS (requires Apple/CSC secrets); otherwise Mac updates by reinstall'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win, arch: x64, track: win-x64, runner: windows-2022 }
          - { platform: mac, arch: x64, track: mac-x64, runner: macos-15-intel }
          - { platform: mac, arch: arm64, track: mac-arm64, runner: macos-15 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Locate desktop source
        id: source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const nested = fs.existsSync('desktop-assistant/package.json');
          const directory = nested ? 'desktop-assistant' : '.';
          const output = path.resolve(nested ? 'output/desktop-assistant' : '../output/desktop-assistant');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dir=${directory}\noutput=${output}\n`);
          NODE
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.source.outputs.dir }}/package-lock.json
      - name: Install, test and package
        working-directory: ${{ steps.source.outputs.dir }}
        env:
          DTCRM_MAC_SIGNED: ${{ matrix.platform == 'mac' && inputs.mac_signed && '1' || '0' }}
          CSC_LINK: ${{ matrix.platform == 'mac' && inputs.mac_signed && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && inputs.mac_signed && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && inputs.mac_signed && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && inputs.mac_signed && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && inputs.mac_signed && secrets.APPLE_TEAM_ID || '' }}
        run: |
          npm ci
          npm test
          npm run build:${{ matrix.platform }} -- --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: DT-Zalo-Counter-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ steps.source.outputs.output }}/${{ matrix.track }}/*/publish/*
          if-no-files-found: error
          retention-days: 14
