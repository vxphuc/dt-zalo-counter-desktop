# Include INSIDE the existing HTTPS server block for dtzalobe.io.vn.
# Do not replace the server block, certificate configuration or CRM locations.
location ^~ /desktop-updates/ {
    alias /var/www/dt-zalo-counter-updates/;
    autoindex off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Missing metadata must return 404, never the CRM SPA's index.html.
}
