# Include INSIDE the existing HTTPS server block for dtzalobe.io.vn.
# Keep this directory outside CRM dist: CRM deployments must not delete installers.
location ^~ /downloads/desktop/ {
    alias /var/www/dt-zalo-downloads/;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Metadata aliases intentionally follow the atomic 'current' symlink.
    disable_symlinks off;
    limit_except GET HEAD { deny all; }
}

# Missing download-page assets must return 404, not the CRM SPA index.
location ^~ /tai-app/ {
    root /var/www/zalo-oa-frontend/dist;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
